aid: infogram
name: Infogram
description: >-
  Infogram is a data visualization platform (based in Riga, Latvia, part of the
  Prezi family) that lets writers, marketers, journalists, researchers, and
  analysts turn raw data into interactive infographics, charts, maps, reports,
  and dashboards that can be embedded or shared anywhere. Its REST API at
  api.infogram.com uses bearer-token authentication and lets developers list and
  copy projects, read and update project entities (text, charts, images), upload
  image assets, publish and unpublish projects, delete projects, and export a
  project as PNG/JPG/PDF or zipped HTML. Long-running export/download tasks are
  monitored over Server-Sent Events via a task-status stream. First-party client
  libraries are published for PHP, Java, Node.js, and Ruby.
